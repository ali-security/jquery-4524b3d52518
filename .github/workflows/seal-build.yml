name: seal-build

on:
  workflow_dispatch: {}

env:
  NPM_CONFIG_REGISTRY: https://:2014-05-01T18%3A05%3A32.863000Z@time-machines-npm.sealsecurity.io/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '0.10'
      - name: Install faketime
        run: sudo apt-get update && sudo apt-get install -y faketime
      - name: Install dependencies
        run: npm install
      - name: Build (grunt, clock set to the 1.11.1 release build time)
        run: faketime -f "@2014-05-01 17:42:00" ./node_modules/.bin/grunt
      - name: Generate dist/cdn release copies (build/release.js makeReleaseCopies)
        run: |
          npm install shelljs@0.2.6
          node -e '
            var Release = {
              newVersion: "1.11.1", preRelease: false, complete: function() {},
              exec: function() {},
              define: function( o ) { o.generateArtifacts(function() {}); }
            };
            require( "./build/release.js" )( Release );
          '
          ls -la dist dist/cdn
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: jquery-npm
          path: jquery-1.11.1.tgz
          if-no-files-found: error
