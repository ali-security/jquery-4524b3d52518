language: node_js
dist: jammy
node_js:
- '0.10'
addons:
  chrome: stable
  apt:
    packages:
    - php-cli
script:
- npm test
- nvm install 20
- PUPPETEER_SKIP_DOWNLOAD=1 npm install --prefix "$HOME/qunit-runner" puppeteer@22.15.0
- PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8000 -t "$TRAVIS_BUILD_DIR" > "$HOME/php-server.log" 2>&1 &
- sleep 2
- PUPPETEER_EXECUTABLE_PATH="$(which google-chrome-stable)" NODE_PATH="$HOME/qunit-runner/node_modules" node .github/scripts/qunit-headless.js http://127.0.0.1:8000
after_failure:
- tail -n 200 "$HOME/php-server.log"
